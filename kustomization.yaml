# Root kustomization: THE deployment entry point for the whole stack.
# It exists only to add the migrations ConfigMap generated from scripts/
# (kustomize forbids file references above the kustomization root, so this
# cannot live in deploy/k8s).
#
# Usage (from the repository root):
#   kubectl apply -k .
#
# Images are built OUT of the repo (no Dockerfiles committed): build node-local
# localhost/td27-{basis,gateway,web}:<tag> yourself, then `make release` bumps
# the newTag values in deploy/k8s/kustomization.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deploy/k8s

# Generated from the real SQL files so migrations stay single-sourced.
# Name is suffix-free so deploy/k8s/migrate-job.yaml can reference it.
configMapGenerator:
  - name: td27-migrations
    files:
      - scripts/001_add_permission_effect.sql
      - scripts/002_role_elevations.sql
      - scripts/003_buttons.sql
    options:
      disableNameSuffixHash: true
      labels:
        app.kubernetes.io/name: td27-migrations
        app.kubernetes.io/part-of: td27
