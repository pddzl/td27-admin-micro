syntax = "proto3";

import "google/protobuf/timestamp.proto";

package basis.common;

option go_package = "td27/rpc/basis/types/common_pb;common_pb";

message IdReq {
  int64 id = 1;
}

message IdsReq {
  repeated int64 ids = 1;
}

message PageReq {
  uint32 page = 1;
  uint32 page_size = 2;
}

message SuccessResp {
  bool success = 1;
}

message Empty {}

message BaseModel {
  int64 id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp updated_at = 3;
}
