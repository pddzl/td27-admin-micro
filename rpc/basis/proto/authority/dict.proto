syntax = "proto3";

import "common/common.proto";
import "google/protobuf/timestamp.proto";

package basis.authority.dict;

option go_package = "td27/rpc/basis/types/authority/dict_pb;dict_pb";

message CreateDictReq {
  string cn_name = 1;
  string en_name = 2;
}

message UpdateDictReq {
  uint64 id = 1;
  optional string cn_name = 2;
  optional string en_name = 3;
}

message DictDetailResp {
  uint64 id = 1;
  string label = 2;
  string value = 3;
  int32 sort = 4;
  string description = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message DictResp {
  uint64 id = 1;
  string cn_name = 2;
  string en_name = 3;
  repeated DictDetailResp details = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message ListDictResp {
  repeated DictResp list = 1;
  int64 total = 2;
}

message GetDictByENNameReq {
  string en_name = 1;
}

message CreateDictDetailReq {
  uint64 dict_id = 1;
  string label = 2;
  string value = 3;
  optional int32 sort = 4;
  optional string description = 5;
  optional int64 parent_id = 6;
}

message UpdateDictDetailReq {
  uint64 id = 1;
  optional string label = 2;
  optional string value = 3;
  optional int32 sort = 4;
  optional string description = 5;
  optional int64 parent_id = 6;
}

service Dict {
  rpc GetDict(basis.common.IdReq) returns (DictResp);
  rpc GetDictByENName(GetDictByENNameReq) returns (DictResp);
  rpc ListDict(basis.common.PageReq) returns (ListDictResp);
  rpc CreateDict(CreateDictReq) returns (basis.common.SuccessResp);
  rpc UpdateDict(UpdateDictReq) returns (DictResp);
  rpc DeleteDict(basis.common.IdReq) returns (basis.common.SuccessResp);
  
  rpc CreateDictDetail(CreateDictDetailReq) returns (basis.common.SuccessResp);
  rpc UpdateDictDetail(UpdateDictDetailReq) returns (DictDetailResp);
  rpc DeleteDictDetail(basis.common.IdReq) returns (basis.common.SuccessResp);
}
