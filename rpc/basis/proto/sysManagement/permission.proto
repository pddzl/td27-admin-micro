syntax = "proto3";

import "common/common.proto";

package basis.sysManagement.permission;

option go_package = "td27/rpc/basis/types/sysManagement/permission_pb;permission_pb";

enum PermissionDomain {
  DOMAIN_MENU = 0;
  DOMAIN_API = 1;
  DOMAIN_BUTTON = 2;
  DOMAIN_DATA = 3;
}

enum Action {
  ACTION_ALL = 0;
  ACTION_VIEW = 1;
  ACTION_READ = 2;
  ACTION_CREATE = 3;
  ACTION_UPDATE = 4;
  ACTION_DELETE = 5;
  ACTION_EXECUTE = 6;
}

enum PermissionEffect {
  EFFECT_ALLOW = 0;
  EFFECT_DENY = 1;
}

message CreatePermissionReq {
  string name = 1;
  PermissionDomain domain = 2;
  string resource = 3;
  Action action = 4;
  int64 domain_id = 5;
  PermissionEffect effect = 6;
}

message UpdatePermissionReq {
  int64 id = 1;
  optional string name = 2;
  optional PermissionDomain domain = 3;
  optional string resource = 4;
  optional Action action = 5;
  optional int64 domain_id = 6;
  optional PermissionEffect effect = 7;
}

message PermissionResp {
  int64 id = 1;
  string name = 2;
  PermissionDomain domain = 3;
  string resource = 4;
  Action action = 5;
  int64 domain_id = 6;
  string created_at = 7;
  string updated_at = 8;
  PermissionEffect effect = 9;
}

message PolicyIssue {
  // "conflict" (deny overrides an allow), "shadowed" (rule made redundant by a
  // broader rule), or "unassigned" (api permission not attached to any role).
  string severity = 1;
  string message = 2;
  int64 role_id = 3;
  int64 permission_id = 4;
}

message LintPoliciesResp {
  repeated PolicyIssue issues = 1;
  int64 total = 2;
}

message ListPermissionResp {
  repeated PermissionResp list = 1;
  int64 total = 2;
}

message CheckPermissionReq {
  // Role ids to check. Used when user_id is 0 (legacy callers).
  repeated int64 role_ids = 1;
  string resource = 2;
  Action action = 3;
  // When set, roles are resolved live from the database for this user,
  // ignoring role_ids (prevents stale grants embedded in JWTs).
  int64 user_id = 4;
}

message CheckPermissionResp {
  bool allowed = 1;
}

service Permission {
  rpc GetPermission(basis.common.IdReq) returns (PermissionResp);
  rpc ListPermission(basis.common.PageReq) returns (ListPermissionResp);
  rpc GetAllPermissions(basis.common.Empty) returns (ListPermissionResp);
  rpc GetPermissionsByRoleId(basis.common.IdReq) returns (ListPermissionResp);
  rpc CreatePermission(CreatePermissionReq) returns (basis.common.SuccessResp);
  rpc UpdatePermission(UpdatePermissionReq) returns (PermissionResp);
  rpc DeletePermission(basis.common.IdReq) returns (basis.common.SuccessResp);
  rpc CheckPermission(CheckPermissionReq) returns (CheckPermissionResp);
  rpc ReloadPolicy(basis.common.Empty) returns (basis.common.SuccessResp);
  rpc LintPolicies(basis.common.Empty) returns (LintPoliciesResp);
}
