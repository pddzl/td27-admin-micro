syntax = "proto3";

import "common/common.proto";

package basis.sysManagement.role;

option go_package = "td27/rpc/basis/types/sysManagement/role_pb;role_pb";

message CreateRoleReq {
  string role_name = 1;
  optional int64 parent_id = 2;
}

message UpdateRoleReq {
  int64 id = 1;
  optional string role_name = 2;
  optional int64 parent_id = 3;
}

message RoleResp {
  int64 id = 1;
  string role_name = 2;
  optional int64 parent_id = 3;
  string created_at = 4;
  string updated_at = 5;
}

message RoleTreeResp {
  RoleResp role = 1;
  repeated RoleTreeResp children = 2;
}

message ListRoleResp {
  repeated RoleResp list = 1;
  int64 total = 2;
}

message AssignPermissionsReq {
  int64 role_id = 1;
  repeated int64 permission_ids = 2;
}

message GetRolePermissionsResp {
  repeated int64 permission_ids = 1;
}

// ---------------------------------------------------------------------------
// JIT (just-in-time) role elevation
// ---------------------------------------------------------------------------

message CreateElevationRequestReq {
  int64 role_id = 1;
  string reason = 2;
  // Requested window in minutes; clamped server-side (5 min .. 24 h).
  int64 duration_minutes = 3;
  // Requester identity, filled by the gateway from the JWT (never the body).
  int64 user_id = 4;
}

message DecideElevationReq {
  int64 id = 1;
  bool approve = 2;
  // Approver identity, filled by the gateway from the JWT (never the body).
  int64 decided_by = 3;
}

message RevokeElevationReq {
  int64 id = 1;
  // Revoker identity, filled by the gateway from the JWT (never the body).
  int64 revoked_by = 2;
}

message ElevationResp {
  int64 id = 1;
  int64 user_id = 2;
  int64 role_id = 3;
  string status = 4;
  string reason = 5;
  int64 duration_minutes = 6;
  string expires_at = 7;
  string created_at = 8;
  string updated_at = 9;
}

message ListElevationResp {
  repeated ElevationResp list = 1;
  int64 total = 2;
}

service Role {
  rpc GetRole(basis.common.IdReq) returns (RoleResp);
  rpc GetRoleWithChildren(basis.common.IdReq) returns (RoleTreeResp);
  rpc ListRole(basis.common.PageReq) returns (ListRoleResp);
  rpc GetAllRoles(basis.common.Empty) returns (ListRoleResp);
  rpc CreateRole(CreateRoleReq) returns (basis.common.SuccessResp);
  rpc UpdateRole(UpdateRoleReq) returns (RoleResp);
  rpc DeleteRole(basis.common.IdReq) returns (basis.common.SuccessResp);
  rpc AssignPermissions(AssignPermissionsReq) returns (basis.common.SuccessResp);
  rpc GetRolePermissions(basis.common.IdReq) returns (GetRolePermissionsResp);
  rpc CreateElevationRequest(CreateElevationRequestReq) returns (basis.common.SuccessResp);
  rpc DecideElevation(DecideElevationReq) returns (basis.common.SuccessResp);
  rpc RevokeElevation(RevokeElevationReq) returns (basis.common.SuccessResp);
  rpc ListElevations(basis.common.Empty) returns (ListElevationResp);
  rpc GetMyElevations(basis.common.IdReq) returns (ListElevationResp);
}