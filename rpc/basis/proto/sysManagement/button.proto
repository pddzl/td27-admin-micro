syntax = "proto3";

import "common/common.proto";

package basis.sysManagement.button;

option go_package = "td27/rpc/basis/types/sysManagement/button_pb;button_pb";

message CreateButtonReq {
  string button_code = 1;
  string button_name = 2;
  optional string description = 3;
  string page_path = 4;
}

message UpdateButtonReq {
  int64 id = 1;
  optional string button_code = 2;
  optional string button_name = 3;
  optional string description = 4;
  optional string page_path = 5;
}

message ButtonResp {
  int64 id = 1;
  string button_code = 2;
  string button_name = 3;
  string description = 4;
  string page_path = 5;
  string created_at = 6;
  string updated_at = 7;
}

message ListButtonResp {
  repeated ButtonResp list = 1;
  int64 total = 2;
}

message GetButtonsByPagePathReq {
  string page_path = 1;
}

message GetUserButtonsReq {
  repeated int64 role_ids = 1;
}

message BatchCheckPermissionReq {
  repeated string button_codes = 1;
  repeated int64 role_ids = 2;
}

message BatchCheckPermissionResp {
  map<string, bool> results = 1;
}

service Button {
  rpc GetButton(basis.common.IdReq) returns (ButtonResp);
  rpc ListButton(basis.common.PageReq) returns (ListButtonResp);
  rpc GetButtonsByPagePath(GetButtonsByPagePathReq) returns (ListButtonResp);
  rpc GetUserButtons(GetUserButtonsReq) returns (ListButtonResp);
  rpc CreateButton(CreateButtonReq) returns (basis.common.SuccessResp);
  rpc UpdateButton(UpdateButtonReq) returns (ButtonResp);
  rpc DeleteButton(basis.common.IdReq) returns (basis.common.SuccessResp);
  rpc BatchCheckPermission(BatchCheckPermissionReq) returns (BatchCheckPermissionResp);
}
