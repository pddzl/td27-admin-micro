syntax = "proto3";

import "common/common.proto";
import "sysManagement/role.proto";

package basis.sysManagement.user;

option go_package = "td27/rpc/basis/types/sysManagement/user_pb;user_pb";

message CreateUserReq {
  string username = 1;
  string password = 2;
  optional string phone = 3;
  optional string email = 4;
  optional bool active = 5;
  optional int64 dept_id = 6;
  repeated int64 role_ids = 7;
}

message UpdateUserReq {
  int64 id = 1;
  optional string username = 2;
  optional string phone = 3;
  optional string email = 4;
  optional bool active = 5;
  optional int64 dept_id = 6;
  repeated int64 role_ids = 7;
}

message UserResp {
  int64 id = 1;
  string username = 2;
  string phone = 3;
  string email = 4;
  bool active = 5;
  int64 dept_id = 6;
  repeated basis.sysManagement.role.RoleResp roles = 7;
  string created_at = 8;
  string updated_at = 9;
}

message ListUserResp {
  repeated UserResp list = 1;
  int64 total = 2;
}

message ModifyPasswdReq {
  int64 id = 1;
  string old_password = 2;
  string new_password = 3;
}

message SwitchActiveReq {
  int64 id = 1;
  bool active = 2;
}

message AssignRolesReq {
  int64 user_id = 1;
  repeated int64 role_ids = 2;
}

message LoginReq {
  string username = 1;
  string password = 2;
}

message LoginResp {
  string token = 1;
  string expiresAt = 2;
  UserResp user = 3;
}

service User {
  rpc Login(LoginReq) returns (LoginResp);
  rpc GetUserInfo(basis.common.IdReq) returns (UserResp);
  rpc ListUser(basis.common.PageReq) returns (ListUserResp);
  rpc DeleteUser(basis.common.IdReq) returns (basis.common.SuccessResp);
  rpc CreateUser(CreateUserReq) returns (basis.common.SuccessResp);
  rpc UpdateUser(UpdateUserReq) returns (UserResp);
  rpc ModifyPassword(ModifyPasswdReq) returns (basis.common.SuccessResp);
  rpc SwitchUserActive(SwitchActiveReq) returns (basis.common.SuccessResp);
  rpc AssignRoles(AssignRolesReq) returns (basis.common.SuccessResp);
}
