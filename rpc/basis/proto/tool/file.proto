syntax = "proto3";

import "common/common.proto";
import "google/protobuf/timestamp.proto";

package basis.tool.file;

option go_package = "td27/rpc/basis/types/tool/file_pb;file_pb";

message UploadFileReq {
  string file_name = 1;
  bytes file_content = 2;
}

message UploadFileResp {
  uint64 file_id = 1;
  string file_name = 2;
  string full_path = 3;
  string mime = 4;
  int64 size = 5;
}

message FileResp {
  uint64 id = 1;
  string file_name = 2;
  string full_path = 3;
  string mime = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message ListFileResp {
  repeated FileResp list = 1;
  int64 total = 2;
}

service File {
  rpc UploadFile(UploadFileReq) returns (UploadFileResp);
  rpc GetFile(basis.common.IdReq) returns (FileResp);
  rpc ListFile(basis.common.PageReq) returns (ListFileResp);
  rpc DeleteFile(basis.common.IdReq) returns (basis.common.SuccessResp);
}
