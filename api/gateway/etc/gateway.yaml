Name: gateway
Host: 0.0.0.0
Port: 8888
Mode: dev

Log:
  ServiceName: gateway
  Mode: console
  Path: logs
  Level: info
  KeepDays: 7
  Rotation: daily
  MaxSize: 5
  Compress: true

Auth:
  AccessSecret: pddzl
  AccessExpire: 86400
  # Per-request RBAC enforcement via rpc Casbin. Requires api-domain
  # permissions in sys_management_permission; keep false until populated.
  EnforceRbac: false

# gRPC client config for discovering basis service
BasisRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: basis.rpc

# CAPTCHA configuration
Captcha:
  key-long: 6
  img-width: 240
  img-height: 80

# Rate limiting: per-IP token buckets + global in-flight request throttle.
# Sensitive* applies to auth endpoints (/login, /captcha, /logout) to blunt
# credential brute-force. /health is always exempt.
RateLimit:
  Enabled: true
  Rate: 50
  Burst: 100
  SensitiveRate: 0.5
  SensitiveBurst: 10
  MaxConcurrent: 200

# CORS configuration
Cors:
  AllowedOrigins:
    - "*"
  AllowedMethods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  AllowedHeaders:
    - Content-Type
    - x-token
