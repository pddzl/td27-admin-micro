# rpc/basis: gRPC service. Discovers etcd, serves PostgreSQL. Scales
# horizontally: go-zero clients load-balance across registered endpoints.
---
apiVersion: v1
kind: Service
metadata:
  name: basis
  namespace: td27
  labels:
    app.kubernetes.io/name: basis
    app.kubernetes.io/part-of: td27
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: basis
  ports:
    - name: grpc
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: basis
  namespace: td27
  labels:
    app.kubernetes.io/name: basis
    app.kubernetes.io/part-of: td27
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: basis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: basis
        app.kubernetes.io/part-of: td27
    spec:
      initContainers:
        # The gateway blocks until basis.rpc is in etcd; wait for etcd to be
        # ready so basis registers on the first try instead of crash-looping.
        - name: wait-for-etcd
          image: quay.io/coreos/etcd:v3.5.17
          command:
            - /bin/sh
            - -c
            - until etcdctl --endpoints=http://etcd-client:2379 endpoint health; do echo waiting for etcd; sleep 2; done
      containers:
        - name: basis
          image: ghcr.io/pddzl/td27-admin-micro/basis:latest
          imagePullPolicy: IfNotPresent
          args: ["-f", "/etc/td27/basis.yaml"]
          ports:
            - containerPort: 8080
              name: grpc
          # No HTTP health endpoint on the gRPC service; TCP checks suffice.
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /etc/td27
              readOnly: true
            - name: uploads
              mountPath: /app/resource/upload
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          secret:
            secretName: basis-config
        - name: uploads
          emptyDir: {}
