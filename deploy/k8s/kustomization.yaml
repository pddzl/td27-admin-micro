apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Apply this directory through the root kustomization (which adds the
# migrations ConfigMap from scripts/):
#   kubectl apply -k .
# This file alone omits td27-migrations; the migrate Job depends on it.

namespace: td27

resources:
  - namespace.yaml
  - datastores.yaml
  - migrate-job.yaml
  - basis.yaml
  - gateway.yaml
  - web.yaml
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
    includeTemplates: true

# Node-local images built on the k8s node (root Makefile, make image-import);
# imagePullPolicy: Never in the Deployments. `make release TAG=vX` bumps all
# three newTag values below.
images:
  - name: localhost/td27-basis
    newTag: v0.1.0
  - name: localhost/td27-gateway
    newTag: v0.1.0
  - name: localhost/td27-web
    newTag: v0.1.0
