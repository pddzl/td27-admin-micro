# Datastore dependency shims: PostgreSQL + etcd run on the HOST, outside k8s.
# This file deliberately contains NO workloads — only two selector-less
# Services backed by manual Endpoints, so in-cluster manifests keep using the
# stable DNS names `postgres:5432` and `etcd-client:2379`.
#
# ONE EDIT PER CLUSTER: replace the RFC-5737 documentation IP 203.0.113.10
# below with the host/node LAN address — in git (ArgoCD selfHeal applies it;
# direct cluster edits are reverted), then `kubectl apply -k .` if not on ArgoCD.
#
# Host side (example, podman; data dirs under /var/lib/td27/):
#   podman run -d --name td27-postgres -p 5432:5432 \
#     -v /var/lib/td27/pg:/var/lib/postgresql/data \
#     docker.m.daocloud.io/library/postgres:16-alpine
#   podman run -d --name td27-etcd -p 2379:2379 \
#     -v /var/lib/td27/etcd:/etcd-data quay.io/coreos/etcd:v3.5.17 \
#     etcd --data-dir=/etcd-data --listen-client-urls=http://0.0.0.0:2379 \
#     --advertise-client-urls=http://<host-ip>:2379
#
# One-time cleanup after first sync (prune:false keeps legacy workloads):
#   kubectl -n td27 delete sts postgres etcd
#   kubectl -n td27 delete pvc -l app.kubernetes.io/name=postgres
#   kubectl -n td27 delete pvc -l app.kubernetes.io/name=etcd
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: td27
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: td27
spec:
  # No selector: backed by the manual Endpoints object below (host postgres).
  ports:
    - name: pg
      port: 5432
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: postgres # MUST equal the Service name
  namespace: td27
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: td27
subsets:
  - addresses:
      - ip: 203.0.113.10 # EDIT: host/node IP running PostgreSQL
    ports:
      - name: pg
        port: 5432
        protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: etcd-client
  namespace: td27
  labels:
    app.kubernetes.io/name: etcd
    app.kubernetes.io/part-of: td27
spec:
  # No selector: backed by the manual Endpoints object below (host etcd).
  ports:
    - name: client
      port: 2379
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: etcd-client # MUST equal the Service name
  namespace: td27
  labels:
    app.kubernetes.io/name: etcd
    app.kubernetes.io/part-of: td27
subsets:
  - addresses:
      - ip: 203.0.113.10 # EDIT: host/node IP running etcd
    ports:
      - name: client
        port: 2379
        protocol: TCP
