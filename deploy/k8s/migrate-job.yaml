# Applies scripts/0*.sql in filename order. The SQL files are NOT inlined
# here: the ROOT kustomization.yaml (repo root) generates the td27-migrations
# ConfigMap from the real files in scripts/, so migrations stay single-sourced.
# Deploy with: kubectl apply -k . (from the repository root), or let the
# ArgoCD Application (deploy/argocd/) sync it.
#
# ArgoCD: the hook annotations below make this Job a Sync hook that ArgoCD
# deletes and recreates on every sync (Jobs are immutable; a plain re-apply
# of a changed Job fails with "field is immutable"). Migrations therefore
# re-run on each ArgoCD sync — scripts must stay safe to re-apply. The
# annotations are inert under plain kubectl.
#
# Jobs are immutable: after changing a script, re-run with
#   kubectl -n td27 delete job td27-migrations --ignore-not-found
#   kubectl apply -k .
# Scripts should therefore be written to be safe to re-apply on a migrated DB.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: td27-migrations
  namespace: td27
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  labels:
    app.kubernetes.io/name: td27-migrations
    app.kubernetes.io/part-of: td27
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: td27-migrations
        app.kubernetes.io/part-of: td27
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: td27-db-credentials
                  key: password
          command:
            - /bin/sh
            - -c
            - until pg_isready -h postgres -U postgres -d td27_micro; do echo waiting for postgres; sleep 2; done
      containers:
        - name: migrate
          image: postgres:16-alpine
          env:
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: td27-db-credentials
                  key: username
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: td27-db-credentials
                  key: dbname
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: td27-db-credentials
                  key: password
          command:
            - /bin/sh
            - -c
            - |
              set -e
              for f in /migrations/0*.sql; do
                echo "=== applying $f ==="
                psql -v ON_ERROR_STOP=1 -f "$f"
              done
              echo "migrations complete"
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: td27-migrations
