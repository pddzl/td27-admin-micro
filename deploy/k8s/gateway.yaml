# api/gateway: HTTP REST entrypoint. Discovers basis via etcd, so it can
# crash-loop until basis registers; the backoff handles that, and /health
# gates traffic.
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: td27
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: td27
spec:
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 8888
      targetPort: 8888
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: td27
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: td27
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: td27
    spec:
      containers:
        - name: gateway
          image: ghcr.io/pddzl/td27-admin-micro/gateway:latest
          imagePullPolicy: IfNotPresent
          args: ["-f", "/etc/td27/gateway.yaml"]
          ports:
            - containerPort: 8888
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8888
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /etc/td27
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          secret:
            secretName: gateway-config
