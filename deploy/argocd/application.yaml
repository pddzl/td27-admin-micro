# ArgoCD Application + project for td27-admin-micro (files in this dir).
#
# One-time bootstrap on the cluster:
#
#   1. Install ArgoCD:
#        kubectl create namespace argocd
#        kubectl apply -n argocd -f \
#          https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
#
#   2. Register the repo (SSH). The repoURL below must EXACTLY match the
#      registration string — ArgoCD matches credentials by URL string:
#        argocd repo add git@github.com:pddzl/td27-admin-micro.git \
#          --ssh-private-key-path ~/.ssh/<read-only-deploy-key>
#      (github.com SSH host keys ship with ArgoCD's argocd-ssh-known-hosts-cm.)
#
#   3. Create the Secrets ArgoCD does NOT manage (plaintext credentials,
#      sources gitignored):   make secret
#
#   4. Register the Application + AppProject:
#        make app               # or: kubectl apply -n argocd -f deploy/argocd/
#
# What ArgoCD manages: the ROOT kustomization (namespace, postgres/etcd,
# migrate Job hook, basis/gateway/web, ingress) — everything in deploy/k8s/.
# What it does NOT manage: td27-db-credentials / basis-config / gateway-config
# Secrets (out-of-band via `make secret`) and ArgoCD's own repo credentials.
#
# Rollout flows:
#   code release:   make release TAG=vX   (build + import images + tag bump + push; ArgoCD syncs)
#   config change:  edit deploy/k8s-configs/*.yaml -> make reconfig (secret + restart)
#   plain restart:  make restart
#
# This dir is safe from ArgoCD's manifest scanner: the Application targets
# path "." which has a kustomization.yaml, so ArgoCD builds kustomize output
# only and never picks up these files as app resources.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: td27
  namespace: argocd
  finalizers:
    # Cascade-delete child resources when the Application itself is removed.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: td27
  source:
    repoURL: git@github.com:pddzl/td27-admin-micro.git
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: td27
  syncPolicy:
    automated:
      # prune deliberately false (house default): deleting a manifest from
      # git will NOT delete the cluster resource — removal is manual.
      prune: false
      # Revert out-of-band kubectl edits; git stays the source of truth.
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    # `kubectl rollout restart` (make reconfig/restart) stamps a restartedAt
    # annotation into pod templates. Ignore it so ArgoCD stays InSync.
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt
